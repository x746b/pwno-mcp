[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwno-mcp"
version = "0.3.0"
description = "MCP server for autonomous low-level security research with pwndbg"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "CC-BY-NC-ND-4.0"
license-files = ["LICENSE"]
authors = [
    {name = "Pwno Team"},
]
dependencies = [
    "fastmcp>=3.1.0,<4",
    "pygdbmi>=0.11.0.0",
    "psutil>=5.9.0",
    "rich>=14.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pwntools>=4.14.1",
    "pwncli @ git+https://github.com/pwno-io/pwnocli.git@a365225ae6fb0e23399b084359b2e6ccca443cbd",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "mypy",
    "types-psutil",
    "types-requests",
]

[tool.setuptools.packages.find]
include = ["pwnomcp*"]
